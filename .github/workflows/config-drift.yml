# 外部状态的只读漂移检查：桶 CORS 来源、旧主机 301 规则与 R2 缓存规则都是“改
# 了仓库但线上没跟上就会静默退化”的项。前者漏放来源时只有浏览器失败；301 规
# 则被删或被改时旧表导入链接会静默断掉；缓存规则失效时表数据与索引会退回每次
# 直连 R2。三项都进入配置，由本工作流在配置变更的 PR、每周 schedule 与手动触
# 发时与线上比对。
#
# 只在配置变更路径上跑：日常 CI 不必依赖 Cloudflare API，避免把抖动带进每次反馈。
name: Config Drift
on:
  pull_request:
    paths:
      - "config/site.json"
      - "config/redirects.json"
      - "config/cache-rules.json"
      - "scripts/check-redirect-rules.ts"
      - "scripts/redirect-rules.ts"
      - "scripts/check-cache-rules.ts"
      - "scripts/cache-rules.ts"
      - "scripts/check-r2-cors.ts"
      - "scripts/check-site-config.ts"
      - "scripts/site-config.ts"
      - "package.json"
    branches: [main]
  schedule:
    # 每周一 04:00 UTC，抓控制台里绕过仓库的改动
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: config-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: In-repo config consistency
        run: pnpm check:config
      - name: Compare R2 bucket CORS policy with config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/check-r2-cors.ts
      - name: Compare Cloudflare Single Redirect rules with config
        env:
          CLOUDFLARE_RULES_TOKEN: ${{ secrets.CLOUDFLARE_RULES_TOKEN }}
        run: node scripts/check-redirect-rules.ts
      - name: Compare Cloudflare cache rules with config
        env:
          CLOUDFLARE_RULES_TOKEN: ${{ secrets.CLOUDFLARE_RULES_TOKEN }}
        run: pnpm check:cache
