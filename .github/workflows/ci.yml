name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新 push 取消尚未完成的旧检查，避免重复消耗 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # CI 里唯一的构建验证点：frontmatter 校验、构建期数据加载与打包错误都在
      # 这里暴露（lint/test/format 不依赖 build 产物）
      - run: pnpm build
      - run: pnpm check
      - run: pnpm check:worker
      - run: pnpm check:config

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: python3 scripts/check-cn-quotes.py $(git ls-files "*.md" "*.svx")

  commit-msg:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          git rev-list --no-merges \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" |
          while read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            python3 scripts/check-commit-msg.py /tmp/commit-msg || exit 1
          done
