name: Update Tables

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-tables.yml"
      # 管线实现变更后自动跑一轮：运行时错误（模块加载、配置解析）当天暴露；
      # 管线自带「先拉 R2 基线再抓取、失败表保留基线」的自愈设计
      - "scripts/fetch-tables.ts"
      - "scripts/pipeline/**"
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      parity:
        description: "只跑新旧实现对拍（不推送 R2、不提交快照）"
        required: false
        type: boolean
        default: false

concurrency:
  group: update-tables
  cancel-in-progress: false

jobs:
  # 默认流水线：抓取、与 R2 双向同步、判定列表变动并按需触发下游重建。
  update:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.parity != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 本工作流做三件事：
      # 1. “抓取 + R2 双向同步”（镜像表页面与 tables.json 由 Worker 运行时应答）
      # 2. 判定列表是否变动（投影口径，见 src/lib/mirror/manifest.ts）：基线对象
      #    也在 R2（meta/last-notified.json），仓库不参与，不产生任何 git 提交。
      # 3. 变动时用 App token 触发 deploy 与 mirror，重建两个静态宿主；主站是运行时
      #    生成，不需要重建。表内容与上游元数据变化不触发。
      #
      # 抓取逻辑在 scripts/fetch-tables.ts（scripts/pipeline/），与站点同仓演进。
      #
      # Secrets 需在本仓库 Settings > Secrets and variables > Actions 中设置：
      #   R2_ACCESS_KEY_ID      — Cloudflare Dashboard > R2 > 管理 R2 API 令牌 > 创建 API 令牌
      #   R2_SECRET_ACCESS_KEY  — 同上（创建时一并生成）
      #   R2_ENDPOINT           — Cloudflare Dashboard > R2 > 存储桶 > S3 API > 端点
      #   R2_BUCKET             — Cloudflare Dashboard > R2 > 存储桶名称
      #   INTERNAL_API_TOKEN    — 站点 Worker 的内部接口共享 token（与 Worker secret 同名同值）
      #   APP_ID / APP_PRIVATE_KEY — GitHub App（触发 deploy 与 mirror）
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install rclone (pinned)
        # 版本固定与 SHA256SUMS 校验的实现在 .github/actions/install-rclone
        uses: ./.github/actions/install-rclone

      - name: Run
        id: pipeline
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # 用户层经站点 Worker 的内部接口读取（管线不直连 D1）
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          echo "=== Pull baseline from R2 ==="
          ./rclone sync r2:${{ secrets.R2_BUCKET }}/ . \
            --include "/tables/**" \
            --include "/indexes/**" \
            --include "/warnings.log" \
            --checksum \
            --transfers 16

          echo "=== Run table pipeline ==="
          node scripts/fetch-tables.ts

          echo "=== Sync to R2 ==="
          ./rclone sync . r2:${{ secrets.R2_BUCKET }}/ \
            --include "/tables/**" \
            --include "/indexes/**" \
            --include "/warnings.log" \
            --checksum \
            --transfers 16

          echo "=== Clean expired trash (30 days) ==="
          # 回收站只由 Worker 写入；目录不存在或没有过期对象时不报错
          ./rclone delete r2:${{ secrets.R2_BUCKET }}/trash --min-age 720h \
            || echo "trash 无过期对象（或目录暂不存在），跳过"

          echo "=== Detect manifest change ==="
          # 基线对象在 R2 的 meta/ 前缀（不在上面的同步白名单内），仓库不参与
          changed=$(node scripts/detect-mirror-change.ts --out=./baseline.json)
          if [ "$changed" = "true" ]; then
            ./rclone copy ./baseline.json "r2:${{ secrets.R2_BUCKET }}/meta/" --transfers 1
            rm -f ./baseline.json
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          rm -f rclone

      - name: Generate app token
        # 用 GitHub App 换短时 installation token 触发下游，不使用长期令牌
        if: steps.pipeline.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Trigger static hosts rebuild
        # 主站是运行时生成，只有两个静态宿主需要重建
        if: steps.pipeline.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "列表变动，触发静态宿主重建"
          gh workflow run deploy.yml --ref main
          gh workflow run mirror.yml --ref main

  # 手动对拍：用公开 R2 基线与固定版本的旧二进制（bms-table-fetch release）
  # 跑两条实现并逐对象比对产物，不写 R2、不影响站点数据。
  parity:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parity == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:parity
