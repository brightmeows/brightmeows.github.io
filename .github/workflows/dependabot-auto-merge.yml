name: Dependabot Auto-Merge
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 只处理 Dependabot 的 PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        # 等待由 GitHub 服务端承担：ruleset 的必过检查全过后自动执行合并，
        # 不在 runner 上轮询（那会引入 600s 超时失败模式与多 run 启用竞态）。
        # 仓库仅允许 merge commit（allow_squash_merge=false），故用 --merge。
        # PR 有冲突时启用会失败，dependabot rebase 触发 synchronize 后重试。
        run: |
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          [ "$enabled" = "true" ] || gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
