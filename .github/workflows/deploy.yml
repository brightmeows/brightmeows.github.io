name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    - cron: "20 */6 * * *"
jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download tables.json from R2
        run: |
          rm -f static/bms/table/mirror/tables.json
          mkdir -p static/bms/table/mirror
          curl --fail --show-error --location -o static/bms/table/mirror/tables.raw.json \
            https://pub-84cdf79347284e449ba30da571d91e41.r2.dev/tables/tables.json
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint and type-check
        run: |
          pnpm lint
          pnpm check
      - name: Build
        run: pnpm build
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static options
          path: "build/"
  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
