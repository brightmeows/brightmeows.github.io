# 站点部署：主站（Cloudflare Workers）。
#
# 静态资源 + Worker，镜像表页面与 tables.json 全部由 Worker 运行时生成；
# 跳转宿主只剩 Codeberg（.forgejo/workflows/deploy.yml 发布 `_redirects`
# 壳），其余旧域与 www 由 Worker 自定义域 + host-redirects.ts 发 301。
#
# 检查（lint/check/test）不在这里重复：main 的提交由 PR 必过门槛与 push 触发的
# CI 覆盖。
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：GITHUB_TOKEN 类合并提交（dependabot auto-merge）不触发
    # push 工作流
    - cron: "20 */6 * * *"

# 部署串行：排队执行让最后一次触发的运行最后部署，避免旧提交覆盖新版本
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
