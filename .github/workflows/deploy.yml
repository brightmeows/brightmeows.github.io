# 站点部署：主站加两个跳转宿主。
#
# - Cloudflare Workers（主站）：静态资源 + Worker，镜像表页面与 tables.json
#   全部由 Worker 运行时生成。
# - GitHub Pages：只发布跳转壳；自定义域由 Cloudflare 代理发 301，平台默认域
#   走客户端跳转。
# - Codeberg Pages：只发布 `_redirects` 跳转壳；自定义域与平台默认域都由
#   Codeberg 服务端发 301。
#
# 检查（lint/check/test）不在这里重复：main 的提交由 PR 必过门槛与 push 触发的
# CI 覆盖，唯一绕过 PR 的路径（deploy key 直推快照）只改数据。
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：GITHUB_TOKEN 类合并提交（dependabot auto-merge）不触发
    # push 工作流
    - cron: "20 */6 * * *"

# 部署串行：排队执行让最后一次触发的运行最后部署，避免旧提交覆盖新版本
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Generate static redirect shell
        # 不再拉主站清单：只生成 GitHub Pages 的跳转壳与 CNAME
        run: node scripts/gen-static-redirects.ts --target=github-pages
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # 跳转壳产物
          path: "build-static/"
  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
