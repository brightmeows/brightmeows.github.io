# 站点部署：构建产物发布到 Cloudflare Workers（静态资源 + mirror 动态路由 Worker）。
#
# 旧托管（GitHub Pages / Codeberg Pages）已于 2026-09-19 冻结：它们的产物停在换血后的
# 那一版（静态 stub 指向 R2 自定义域、canonical 指向新域名），不再随仓库更新，仓库里
# 也不再有 stub 生成物。本工作流只负责新域名的部署。
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：GITHUB_TOKEN 类合并提交（dependabot auto-merge）不触发
    # push 工作流，由本 cron 收敛至至多 6 小时
    - cron: "20 */6 * * *"
jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint, type-check and test
        run: |
          pnpm lint
          pnpm check
          pnpm check:worker
          pnpm test
      - name: Build
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
