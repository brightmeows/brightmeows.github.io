# 站点部署：三个目标，按目标分区。
#
# - Cloudflare Workers（主站）：静态资源 + Worker，镜像表页面与
#   tables.json 由 Worker 运行时生成，因此 Cloudflare 侧**不**需要构建期产出的
#   镜像页——所以 `wrangler deploy` 必须排在生成步骤之前（顺序反了会把 443 个
#   静态页一起传上去，虽不致命但会白白增加上传量）。
# - GitHub Pages（静态镜像目标之一）：构建期生成静态镜像页与站点清单后发布。
# - Codeberg Pages（静态镜像目标之二）：由 .forgejo/workflows/deploy.yml
#   在 Codeberg 侧跑同样的「构建 + 生成」流程。
#
# 检查（lint/check/test）不在这里重复：main 的提交由 PR 必过门槛与 push 触发的
# CI 覆盖，唯一绕过 PR 的路径（deploy key 直推快照）只改数据。
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：GITHUB_TOKEN 类合并提交（dependabot auto-merge）不触发
    # push 工作流，也兜住「清单快照在两次代码提交之间更新」的情况
    - cron: "20 */6 * * *"

# 部署串行：排队执行让最后一次触发的运行最后部署，避免旧提交覆盖新版本
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Generate static mirror pages
        # 离线生成（只读仓库内快照与 build/404.html）；失败即整步失败，避免用缺失
        # 镜像页的产物覆盖上一版仍可用的 GitHub Pages 站点
        run: node scripts/gen-static-mirror-pages.ts --target=github-pages
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static options
          path: "build/"
  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
