# 迁移期双轨部署：同一份构建产物同时发布到 GitHub Pages 与 Cloudflare Workers。
# 冻结旧托管时，删除 Pages 上传/部署步骤与 push 触发，只保留 Cloudflare 部署。
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：GITHUB_TOKEN 类合并提交（dependabot auto-merge）不触发
    # push 工作流，由本 cron 收敛至至多 6 小时
    - cron: "20 */6 * * *"
jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint, type-check and test
        run: |
          pnpm lint
          pnpm check
          pnpm test
      - name: Build
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static options
          path: "build/"
  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
