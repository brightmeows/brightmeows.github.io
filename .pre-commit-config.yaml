# Each hook in its own `- repo: local` block so pre-commit runs them
# concurrently (same-repo hooks are serial).
#
# All pnpm hooks use pass_filenames: false because the command operates
# on the project as a whole, not individual files.
# All pnpm hooks specify types: [text] so pre-commit can skip early when
# no text files are staged (only binary changes).
#
# 同时安装 pre-commit 与 commit-msg 两类 hook：
#   pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: format-check
        name: pnpm format:check
        # exit non-zero if any file differs
        entry: pnpm format:check
        language: system
        types: [text]
        pass_filenames: false

  - repo: local
    hooks:
      - id: lint
        name: pnpm lint
        entry: pnpm lint
        language: system
        types: [text]
        pass_filenames: false

  - repo: local
    hooks:
      - id: svelte-check
        name: pnpm check
        entry: pnpm check
        language: system
        types: [text]
        pass_filenames: false

  - repo: local
    hooks:
      - id: mirror-typecheck
        name: pnpm check:mirror
        entry: pnpm check:mirror
        language: system
        types: [text]
        pass_filenames: false

  - repo: local
    hooks:
      - id: worker-typecheck
        name: pnpm check:worker
        entry: pnpm check:worker
        language: system
        types: [text]
        pass_filenames: false

  - repo: local
    hooks:
      - id: vitest
        name: pnpm test
        entry: pnpm test
        language: system
        types: [text]
        pass_filenames: false

  # Detect invisible or confusable Unicode characters that look like
  # ASCII equivalents, which can hide in string literals, comments, or
  # documentation and cause subtle bugs or security issues.
  #
  # Codepoints checked (all UTF-8 encoded via printf \xNN):
  #   U+2010/2011/2012  HYPHEN / NB HYPHEN / FIGURE DASH  →  looks like -
  #   U+2212  MINUS SIGN                                   →  looks like -
  #   U+00A0  NO-BREAK SPACE                               →  looks like space
  #   U+202F  NARROW NB SPACE                              →  looks like space
  #   U+200B  ZERO WIDTH SPACE                             →  invisible
  #   U+FEFF  BOM                                          →  invisible
  - repo: local
    hooks:
      - id: no-confusable-unicode
        name: no confusable Unicode dashes/spaces (use ASCII instead)
        entry: >
          bash -c '! rg -l
          -e "$(printf "\xe2\x80\x90")" -e "$(printf "\xe2\x80\x91")"
          -e "$(printf "\xe2\x80\x92")" -e "$(printf "\xe2\x88\x92")"
          -e "$(printf "\xc2\xa0")"    -e "$(printf "\xe2\x80\xaf")"
          -e "$(printf "\xe2\x80\x8b")" -e "$(printf "\xef\xbb\xbf")"
          "$@"' _
        language: system
        types: [text]

  # 中文文本引号规范（GB/T 15834-2011）：中文表达必须用弯引号。
  # Markdown 扫直引号与直角/全角无向引号（跳过 frontmatter、代码块与
  # HTML 标签）；代码与配置只扫直角与全角无向引号（ASCII 直引号是语法）。
  # static/ 是数据资产（含日文原文）不扫；行内含 cn-quotes-ignore 可豁免。
  - repo: local
    hooks:
      - id: cn-quotes
        name: Chinese quotes follow GB/T 15834-2011
        entry: python3 scripts/check-cn-quotes.py
        language: system
        files: \.(md|svx|ts|svelte|js|py|yml|yaml|json|jsonc|toml|css|html)$
        exclude: ^static/

  # 同一事实在不能 import 配置的地方（wrangler.jsonc、工作流 YAML、oxfmt 忽略项、
  # 版本文件）必须与 config/site.json 一致；纯离线、毫秒级。
  - repo: local
    hooks:
      - id: site-config
        name: config/site.json consistency with workflows and wrangler
        entry: node scripts/check-site-config.ts
        language: system
        files: ^(config/site\.json|wrangler\.jsonc|\.oxfmtrc\.json|\.nvmrc|package\.json)$|^\.(github|forgejo)/workflows/.*\.ya?ml$
        pass_filenames: false

  # 提交信息遵循 Conventional Commits（见 AGENTS.md“提交格式”）
  - repo: local
    hooks:
      - id: conventional-commit
        name: commit message follows Conventional Commits
        entry: python3 scripts/check-commit-msg.py
        language: system
        stages: [commit-msg]
