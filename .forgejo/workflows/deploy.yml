# Codeberg Pages 部署（静态镜像目标之一）。
#
# 代码经 mirror.yml 从 GitHub 推到这里，本工作流在 Codeberg 侧跑“构建 + 生成静态
# 镜像页 + 发布”。目标域名由配置解析（--target），因此这里不出现任何域名；
# Cloudflare 侧由 Worker 动态生成，不涉及这里。
name: Deploy to Codeberg Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：与 GitHub 侧对称，兜住镜像推送延迟与清单快照更新
    - cron: "20 */6 * * *"

# Codeberg runner 资源有限：连续推送时只保留最新一轮构建
concurrency:
  group: codeberg-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: codeberg-small-lazy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Build
        run: |
          echo "::group::Install dependencies"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

          echo "::group::Build"
          pnpm build
          echo "::endgroup::"
      - name: Generate static mirror pages
        # 从主站拉取已合成清单（含用户增删与保护标记）后生成静态镜像页与站点清单
        run: node scripts/gen-static-mirror-pages.ts --target=codeberg-pages
      - name: Resolve publish URLs from config
        # site 是自定义子域（主发布目标）；legacy 是平台原域（同步发布一份带
        # 兜底跳转逻辑的副本）；server 是 git-pages 服务主机名（自定义域证书
        # 就绪前上传时的 TLS 连接用）。域名一律从配置派生，不写进工作流。
        run: |
          echo "SITE_BASE=$(node scripts/site-target.ts --target=codeberg-pages)" >> "$GITHUB_ENV"
          echo "LEGACY_BASE=$(node scripts/site-target.ts --target=codeberg-pages --legacy-base)" >> "$GITHUB_ENV"
          echo "PAGES_SERVER=$(node scripts/site-target.ts --target=codeberg-pages --server)" >> "$GITHUB_ENV"
      - name: Deploy to Codeberg Pages (custom domain)
        # 首次向自定义域发布前需 DNS TXT 授权（_git-pages-forge-allowlist.<域> →
        # 发布仓库地址），否则上传被拒；证书由服务在授权后自动签发，
        # server 参数提供证书就绪前的 TLS 连接主机。机制与外部状态见
        # packages/worker/AGENTS.md 的 git-pages 条目。
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.SITE_BASE }}
          server: ${{ env.PAGES_SERVER }}
          token: "${{ forge.token }}"
          source: build/
      - name: Deploy to Codeberg Pages (legacy wildcard domain)
        # 同步更新平台原域的内容：新前端的兜底跳转随这次发布到位（无此步骤时
        # 原域会停留在旧版，访客不会收敛到子域）。
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.LEGACY_BASE }}
          server: ${{ env.PAGES_SERVER }}
          token: "${{ forge.token }}"
          source: build/
