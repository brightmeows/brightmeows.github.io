name: Deploy to Codeberg Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：GITHUB_TOKEN 类合并提交不触发 push 工作流
    - cron: "20 */6 * * *"
jobs:
  build_and_deploy:
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Build
        run: |
          echo "::group::Install dependencies"
          pnpm install
          echo "::endgroup::"

          echo "::group::Download tables.json from R2"
          rm -f static/bms/table/mirror/tables.json
          mkdir -p static/bms/table/mirror
          curl -o static/bms/table/mirror/tables.raw.json \
            https://pub-84cdf79347284e449ba30da571d91e41.r2.dev/tables/tables.json
          echo "::endgroup::"

          echo "::group::Build"
          pnpm build
          echo "::endgroup::"
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://brightmeows.codeberg.page/"
          token: "${{ forge.token }}"
          source: build/
