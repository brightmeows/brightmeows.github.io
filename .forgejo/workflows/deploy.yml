name: Deploy to Codeberg Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    - cron: "20 */6 * * *"
jobs:
  build_and_deploy:
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: latest
      - run: pnpm install
      - name: Download tables.json from R2
        run: |
          mkdir -p static/bms/table/mirror
          curl -o static/bms/table/mirror/tables.json \
            https://pub-84cdf79347284e449ba30da571d91e41.r2.dev/tables/tables.json
      - name: Transform tables.json URLs
        run: |
          jq '[.[] | .url_from = .url | .url = ("https://brightmeows.codeberg.page/bms/table/mirror/" + ("[" + (.url | capture("://(?<h>[^/]+)").h) + "] " + .name | @uri) + "/")]' \
            static/bms/table/mirror/tables.json > /tmp/tables.json \
            && mv /tmp/tables.json static/bms/table/mirror/tables.json
      - run: pnpm build
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://brightmeows.codeberg.page/"
          token: "${{ forge.token }}"
          source: build/
