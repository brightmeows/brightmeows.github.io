name: Deploy to Codeberg Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
jobs:
  build_and_deploy:
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Build
        run: |
          echo "::group::Install dependencies"
          pnpm install
          echo "::endgroup::"

          echo "::group::Build"
          pnpm build
          echo "::endgroup::"
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://brightmeows.codeberg.page/"
          token: "${{ forge.token }}"
          source: build/
