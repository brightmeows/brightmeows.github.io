# Codeberg Pages 部署（镜像目标之一）。
#
# 代码经 mirror.yml 从 GitHub 推到这里，本工作流在 Codeberg 侧跑「构建 + 生成静态
# 镜像页 + 发布」。清单里的 url 指向 codeberg 自己的域名，因此 Codeberg 用户拿到的
# 导入地址与清单都指向本站；Cloudflare 侧由 Worker 动态生成，不涉及这里。
name: Deploy to Codeberg Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：与 GitHub 侧对称，兜住镜像推送延迟与清单快照更新
    - cron: "20 */6 * * *"
jobs:
  build_and_deploy:
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Build
        run: |
          echo "::group::Install dependencies"
          pnpm install
          echo "::endgroup::"

          echo "::group::Build"
          pnpm build
          echo "::endgroup::"
      - name: Generate static mirror pages
        run: node scripts/gen-static-mirror-pages.ts --target=codeberg-pages
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://brightmeows.codeberg.page/"
          token: "${{ forge.token }}"
          source: build/
