# Codeberg Pages 部署（静态镜像目标之一）。
#
# 代码经 mirror.yml 从 GitHub 推到这里，本工作流在 Codeberg 侧跑「构建 + 生成静态
# 镜像页 + 发布」。目标域名由配置解析（--target），因此这里不出现任何域名；
# Cloudflare 侧由 Worker 动态生成，不涉及这里。
name: Deploy to Codeberg Pages
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 6 小时兜底重建：与 GitHub 侧对称，兜住镜像推送延迟与清单快照更新
    - cron: "20 */6 * * *"
jobs:
  build_and_deploy:
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Build
        run: |
          echo "::group::Install dependencies"
          pnpm install
          echo "::endgroup::"

          echo "::group::Build"
          pnpm build
          echo "::endgroup::"
      - name: Generate static mirror pages
        run: node scripts/gen-static-mirror-pages.ts --target=codeberg-pages
      - name: Resolve site base from config
        run: echo "SITE_BASE=$(node scripts/site-target.ts --target=codeberg-pages)" >> "$GITHUB_ENV"
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.SITE_BASE }}
          token: "${{ forge.token }}"
          source: build/
