name: Deploy to Codeberg Pages
on:
  push:
    branches: "main"
  schedule:
    - cron: "0 * * * *"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download table mirror data
        run: |
          curl --fail --show-error --location -o /tmp/bms-table-mirror.zip \
            https://github.com/MiyakoMeow/bms-table-mirror/archive/refs/heads/main.zip
          unzip -o /tmp/bms-table-mirror.zip -d /tmp
          mkdir -p static/bms/table/mirror
          cp /tmp/bms-table-mirror-main/outputs/tables_miyakomeow.json static/bms/table/mirror/tables.json
          cp -r /tmp/bms-table-mirror-main/tables/* static/bms/table/mirror/
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - run: pnpm install
      - run: pnpm build
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://brightmeows.codeberg.page/"
          token: "${{ forge.token }}"
          source: build/
